name: Docs & Data CI/CD (GitHub Pages & Read the Docs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-and-docs
  cancel-in-progress: false

jobs:
  validate-and-build-docs:
    name: Validate Data & Build MkDocs Site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Verify deterministic datasets and reports
        run: |
          python3 scripts/build_dataset_and_reports.py --backend local
          git diff --exit-code data/ reports/

      - name: Install MkDocs dependencies
        run: pip install -r docs/requirements.txt

      - name: Prepare Read the Docs staging & run strict MkDocs build
        run: |
          python3 scripts/prepare_docs.py
          mkdocs build --strict

      - name: Upload built documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: bekb-docs-site
          path: site/
          retention-days: 14

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-readthedocs:
    name: Trigger Read the Docs Webhook
    needs: validate-and-build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Read the Docs build webhook (if configured)
        env:
          RTD_WEBHOOK_URL: ${{ secrets.RTD_WEBHOOK_URL }}
          RTD_WEBHOOK_TOKEN: ${{ secrets.RTD_WEBHOOK_TOKEN }}
        run: |
          if [ -n "$RTD_WEBHOOK_URL" ] && [ -n "$RTD_WEBHOOK_TOKEN" ]; then
            curl --fail-with-body -X POST \
              -d "branches=${GITHUB_REF_NAME}" \
              -d "token=${RTD_WEBHOOK_TOKEN}" \
              "${RTD_WEBHOOK_URL}"
            echo "Read the Docs build successfully triggered."
          else
            echo "RTD_WEBHOOK_URL / RTD_WEBHOOK_TOKEN not set; skipping manual webhook trigger (native Read the Docs GitHub integration handles auto-builds)."
          fi
